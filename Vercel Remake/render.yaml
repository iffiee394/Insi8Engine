services:
  - type: web
    name: insightengine-api
    env: python
    plan: starter
    buildCommand: pip install -r "Vercel Remake/api/requirements.txt"
    startCommand: cd "Vercel Remake/api" && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ALLOWED_ORIGINS
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

  - type: worker
    name: insightengine-worker
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt -r "Vercel Remake/worker/requirements.txt"
    startCommand: cd "Vercel Remake" && python worker/worker.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WORKER_POLL_SECONDS
        value: "5"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
