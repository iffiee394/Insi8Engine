[project]
name = "insightengine-api"
version = "0.1.0"
description = "FastAPI service for the InsightEngine Vercel remake"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0,<1",
    "uvicorn[standard]>=0.35.0,<1",
    "psycopg2-binary>=2.9.9,<3",
    "pydantic>=2.9.0,<3",
    "python-dotenv>=1.0.1,<2",
    "requests>=2.31.0,<3",
]

[tool.vercel]
entrypoint = "app.main:app"
