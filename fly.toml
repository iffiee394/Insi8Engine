app = "insightengine-worker"
primary_region = "sin"

[build]
  dockerfile = "Vercel Remake/worker/Dockerfile"

[env]
  WORKER_POLL_SECONDS = "5"
  LEGACY_APP_ROOT = "/app"
  LLM_PRIMARY = "gemini"
  FALLBACK_TO_ANTHROPIC = "true"
  BATCH_USE_ANTHROPIC = "false"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
